name: lint

on:
  push:
  pull_request:

# Public repo: iş akışı yalnızca kodu okuyabilsin
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      LC_ALL: C.UTF-8
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck
        run: shellcheck scripts/*.sh templates/scripts/*.sh templates/setup-scripts/*.sh tests/*.sh
      - name: Smoke test
        run: bash tests/smoke.sh
